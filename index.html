<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las Aventuras de las Manitos Limpias</title>
  <link rel="stylesheet" href="CSS/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>🧼 Las Aventuras de las Manitos Limpias</h1>
      <span id="page-indicator">1 / 21</span>
    </header>

    <div class="book-viewport">
      <div id="book-stage"></div>
    </div>

    <nav class="controls">
      <button id="btn-prev">⬅️ Anterior</button>
      
      <!-- Selector de voces (opcional) -->
      <select id="voice-selector" style="
        padding: 8px 14px;
        border-radius: 25px;
        border: 3px solid #ffbe76;
        background: white;
        font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        color: #2d3436;
        cursor: pointer;
        outline: none;
        min-width: 140px;
        transition: all 0.3s ease;
      ">
        <option value="">🔊 Elegir voz</option>
      </select>
      
      <button id="btn-next">Siguiente ➡️</button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
